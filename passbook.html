<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Milk Passbook</title>
<style>
  :root { --pri:#0F6E56; --pri2:#E1F5EE; --bg:#F5F6F3; --card:#fff; --tx:#1c1c1a; --mut:#6b6b66; --line:#e3e3dc; --red:#A32D2D; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121412; --card:#1d201d; --tx:#ecece6; --mut:#a3a39b; --line:#2e322e; --pri2:#183a30; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.45 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  header { background:var(--pri); color:#fff; padding:18px 16px 22px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; opacity:.9; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:14px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .bal { text-align:center; }
  .bal span { color:var(--mut); font-size:14px; }
  .bal b { display:block; font-size:32px; margin-top:2px; }
  .red { color:var(--red); } .green { color:var(--pri); }
  .pay { display:block; text-align:center; background:var(--pri); color:#fff; text-decoration:none; padding:12px; border-radius:12px; font-weight:700; margin-top:12px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; }
  .tabs button { flex:none; border:1px solid var(--line); background:var(--card); color:var(--tx); padding:7px 12px; border-radius:16px; font:inherit; font-size:13px; }
  .tabs button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  .li { display:flex; justify-content:space-between; padding:5px 0; }
  .li.tot { border-top:1px solid var(--line); margin-top:6px; padding-top:9px; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:7px 4px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--mut); font-weight:600; font-size:13px; }
  .note { color:var(--mut); font-size:12.5px; text-align:center; margin-top:16px; }
  .msg { text-align:center; padding:60px 20px; color:var(--mut); }
  h2 { font-size:16px; margin:0 0 8px; }
</style>
</head>
<body>
<div id="app"><p class="msg">Loading…</p></div>
<script>
// Milk Bill customer passbook. The token in the link opens exactly one customer's record.
const SUPABASE_URL = 'https://gytaifdexwgwonjdmpkw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BT8A3Goef2rU3rnxdxHthA_vadqC1Zp'; // public key; data is protected by the token check in get_passbook
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = document.getElementById('app');
let D = null, sel = 0;
const fmt = (n, lc) => Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const money = n => (n < 0 ? '-' : '') + '₹' + fmt(Math.abs(n));
function day(s) { try { return new Intl.DateTimeFormat(D.locale || 'hi-IN', { weekday: 'short', day: 'numeric', month: 'short' }).format(new Date(s + 'T00:00:00')); } catch (e) { return s; } }
function render() {
  const L = D.lbl || {}, m = D.months[sel] || { days: [] }, u = D.unit || 'L', adv = D.balance < -0.5;
  const upi = D.upi && D.balance > 0.5 ? `upi://pay?pa=${encodeURIComponent(D.upi)}&pn=${encodeURIComponent(D.dairy)}&am=${D.balance.toFixed(2)}&cu=INR&tn=${encodeURIComponent('Milk ' + D.name)}` : '';
  const rows = m.days.slice().reverse().map(([d, am, pm, l2, st]) => st === 1 ? `<tr><td>${esc(day(d))}</td><td colspan="${D.m2 ? 3 : 2}" class="red">${esc(L.nd)}</td></tr>`
    : st === 2 ? `<tr><td>${esc(day(d))}</td><td colspan="${D.m2 ? 3 : 2}">${esc(L.holiday)}</td></tr>`
    : `<tr><td>${esc(day(d))}</td><td>${fmt(am)}</td><td>${fmt(pm)}</td>${D.m2 ? `<td>${fmt(l2)}</td>` : ''}</tr>`).join('');
  let upd = ''; try { upd = new Date(D.updated_at).toLocaleString(D.locale || 'hi-IN'); } catch (e) { upd = D.updated_at; }
  app.innerHTML = `<header><h1>${esc(D.dairy)}</h1><p>${esc(L.passbook || 'Passbook')} · ${esc(D.name)}${D.phone ? ' · ' + esc(D.phone) : ''}</p></header><main>
  <div class="card bal"><span>${esc(adv ? L.advance : L.balance)}</span><b class="${D.balance > 0.5 ? 'red' : 'green'}">${money(Math.abs(D.balance))}</b>
  ${upi ? `<a class="pay" href="${esc(upi)}">${esc(L.pay || 'Pay with UPI')} · ${money(D.balance)}</a>` : ''}</div>
  <div class="tabs">${D.months.map((x, i) => `<button class="${i === sel ? 'on' : ''}" data-i="${i}">${esc(x.label)}</button>`).join('')}</div>
  <div class="card"><div class="li"><span>${esc(L.milk)}</span><b>${fmt(m.L)} ${esc(u)}</b></div><div class="li"><span>${esc(L.bill)}</span><b>${money(m.total)}</b></div>
  ${Math.abs(m.prev) > 0.005 ? `<div class="li"><span>${esc(L.prev)}</span><b>${money(m.prev)}</b></div>` : ''}${m.paid ? `<div class="li"><span>${esc(L.paid)}</span><b>− ${money(m.paid)}</b></div>` : ''}
  <div class="li tot"><span>${esc(L.due)}</span><b>${money(m.due)}</b></div></div>
  <div class="card"><table><thead><tr><th>${esc(L.date)}</th><th>${esc(L.morning)}</th><th>${esc(L.evening)}</th>${D.m2 ? `<th>${esc(D.m2)}</th>` : ''}</tr></thead><tbody>${rows || `<tr><td colspan="4">—</td></tr>`}</tbody></table></div>
  ${D.pays && D.pays.length ? `<div class="card"><h2>${esc(L.payments)}</h2>${D.pays.map(([d, a, mode]) => `<div class="li"><span>${esc(day(d))} · ${esc(mode)}</span><b class="green">${money(a)}</b></div>`).join('')}</div>` : ''}
  <p class="note">${esc(L.updated || 'Updated')}: ${esc(upd)} · Milk Bill</p></main>`;
}
app.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { sel = +b.dataset.i; render(); } });
(async () => {
  const token = new URLSearchParams(location.search).get('t') || '';
  if (token.length < 20) { app.innerHTML = '<p class="msg">This passbook link is not valid.</p>'; return; }
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_passbook', { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }) });
    const j = r.ok ? await r.json() : null;
    if (!j || !j.months) { app.innerHTML = '<p class="msg">This passbook link has been stopped or is not valid.</p>'; return; }
    D = j; document.documentElement.lang = (D.locale || 'hi').slice(0, 2); document.title = D.dairy + ' · ' + D.name; render();
  } catch (e) { app.innerHTML = '<p class="msg">Could not load. Please check your internet and open the link again.</p>'; }
})();
</script>
</body>
</html>
